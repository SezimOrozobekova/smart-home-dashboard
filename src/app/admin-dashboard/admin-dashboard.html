<div class="admin-layout">
  <button
    class="sidebar-toggle"
    type="button"
    (click)="toggleSidebar()"
    aria-label="Open admin sidebar">
    ☰
  </button>

  <div
    class="sidebar-backdrop"
    *ngIf="isSidebarOpen"
    (click)="closeSidebar()">
  </div>

  <app-admin-sidebar
    class="admin-sidebar"
    [class.mobile-open]="isSidebarOpen">
  </app-admin-sidebar>

  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
