<mat-toolbar class="app-toolbar">
  <div class="brand">
    <div class="brand-mark"></div>

    <div class="brand-text">
      <span class="logo">Smart Home</span>
      <span class="brand-sub">Energy Platform</span>
    </div>
  </div>

  <nav class="nav desktop-nav">
    <a
      mat-button
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }">
      Dashboard
    </a>

    <a
      mat-button
      routerLink="/devices"
      routerLinkActive="active">
      Devices
    </a>

    <a
      mat-button
      routerLink="/home3d"
      routerLinkActive="active">
      3D Home
    </a>

    <a
      mat-button
      routerLink="/admin"
      routerLinkActive="active">
      Manage
    </a>

    <a
      mat-button
      routerLink="/insights"
      routerLinkActive="active">
      Insights
    </a>
  </nav>

  <div class="header-actions">
    <div class="header-info">
      <div class="weather">
        <span class="weather-icon">☁</span>
        <span>18°C Cloudy</span>
      </div>

      <div class="divider"></div>

      <div class="time">19:45</div>
    </div>

    <button
      mat-icon-button
      class="burger-btn"
      [matMenuTriggerFor]="mobileMenu"
      aria-label="Open navigation menu">
      <mat-icon>menu</mat-icon>
    </button>
  </div>
</mat-toolbar>

<mat-menu #mobileMenu="matMenu" panelClass="mobile-menu-panel">
  <button
    mat-menu-item
    routerLink="/"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }">
    <mat-icon>dashboard</mat-icon>
    <span>Dashboard</span>
  </button>

  <button
    mat-menu-item
    routerLink="/devices"
    routerLinkActive="active">
    <mat-icon>devices</mat-icon>
    <span>Devices</span>
  </button>

  <button
    mat-menu-item
    routerLink="/home3d"
    routerLinkActive="active">
    <mat-icon>home</mat-icon>
    <span>3D Home</span>
  </button>

  <button
    mat-menu-item
    routerLink="/admin"
    routerLinkActive="active">
    <mat-icon>settings</mat-icon>
    <span>Manage</span>
  </button>

  <button
    mat-menu-item
    routerLink="/insights"
    routerLinkActive="active">
    <mat-icon>insights</mat-icon>
    <span>Insights</span>
  </button>
</mat-menu>
