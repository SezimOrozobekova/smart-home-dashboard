<div class="layout">
  <section class="board">
    <header class="board__header">
      <div class="board__title">
        <div class="board__pill">3D</div>
        <div>
          <div class="board__h">Home Model</div>
          <div class="board__sub">Click device to toggle</div>
        </div>
      </div>
    </header>

    <div class="board__stage">
      @if (!isLoadingRooms() && currentRoom()) {
        <app-home-scene
          [roomLayout]="currentRoom()"
          (deviceSelected)="onDeviceSelected($event)"
        ></app-home-scene>
      } @else {
        <div class="rooms__status">Loading room...</div>
      }
    </div>
  </section>

  <aside class="panel">
    <div class="rooms">
      <div class="rooms__title">Rooms</div>

      @for (room of rooms(); track room.roomId) {
        <button
          class="room-btn"
          [class.active]="room.roomId === currentRoom()?.roomId"
          (click)="selectRoom(room.roomId)"
        >
          {{ room.roomName }}
        </button>
      }
    </div>
  </aside>

  <div class="device-card" *ngIf="showDeviceCard">
    <div class="device-card__title">
      {{ selectedDeviceName }}
    </div>

    <div
      class="device-card__status"
      [class.on]="selectedDeviceState"
      [class.off]="!selectedDeviceState"
    >
      {{ selectedDeviceState ? 'ON' : 'OFF' }}
    </div>
  </div>
</div>
