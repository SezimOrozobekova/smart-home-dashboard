<div class="device-card kettle">
  <div class="card-header">
    <span class="icon">☕</span>
    <span>Kettle</span>
  </div>

  <div class="card-main">
    <div class="big-value">{{ timeLeft }}s</div>
    <div class="subtitle">Time remaining</div>
  </div>

  <div class="progress">
    <div
      class="progress-bar"
      [style.width.%]="progressWidth"
    ></div>
  </div>
</div>
