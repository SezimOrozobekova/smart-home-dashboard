<section class="control-section">
  <div class="control-section__header">
    <div>
      <div class="control-section__eyebrow">Temperature control</div>
      <h4 class="control-section__title">Refrigerator</h4>
    </div>
  </div>

  <div class="metric-block">
    <div class="metric-block__value">
      {{ temperature }}<span>°C</span>
    </div>
    <div class="metric-block__label">Current temperature</div>
  </div>

  <div class="range-block">
    <div class="range-block__labels">
      <span>-18°C</span>
      <span>8°C</span>
    </div>

    <div class="range-block__track">
      <div class="range-block__fill"></div>
      <div
        class="range-block__thumb"
        [style.left.%]="((temperature + 18) / 26) * 100"
      ></div>
    </div>
  </div>

  <div class="stepper-block">
    <div class="stepper-block__label">Adjust temperature</div>

    <div class="stepper">
      <button type="button" class="stepper__btn" (click)="change(-1)">
        Decrease
      </button>
      <button type="button" class="stepper__btn" (click)="change(1)">
        Increase
      </button>
    </div>
  </div>
</section>
