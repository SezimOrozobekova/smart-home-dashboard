<section class="control-section lamp-section">
  <div class="control-section__header">
    <div>
      <div class="control-section__eyebrow">Lighting device</div>
      <h4 class="control-section__title">Bathroom Light</h4>
    </div>

    <div
      class="status-badge"
      [class.status-badge--on]="status === 'ON'"
    >
      {{ status === 'ON' ? 'On' : 'Off' }}
    </div>
  </div>

  <div class="metric-block">
    <div class="metric-block__value">
      {{ status === 'ON' ? 'Active' : 'Inactive' }}
    </div>
    <div class="metric-block__label">Current light state</div>
  </div>

  <div class="action-block">
    <div class="action-block__label">Power control</div>
    <button type="button" class="primary-btn" (click)="onToggle()">
      {{ status === 'ON' ? 'Turn off' : 'Turn on' }}
    </button>
  </div>

  <div class="palette-block">
    <div class="palette-block__label">Light color</div>

    <div class="color-palette">
      <button
        type="button"
        class="color-swatch"
        *ngFor="let c of colors"
        [style.background]="c"
        (click)="selectColor(c)"
        [attr.aria-label]="'Select color ' + c"
      ></button>
    </div>
  </div>
</section>
