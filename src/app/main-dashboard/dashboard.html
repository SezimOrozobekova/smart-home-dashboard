<div class="dashboard">
  <section class="dashboard-section section-cards">
    <app-starfield-parallax-background></app-starfield-parallax-background>

    <div class="section-container">
      <div class="dashboard-hero">
        <div class="dashboard-eyebrow">Monitoring platform</div>

        <h1 class="dashboard-title">
          Smart Home Monitoring Dashboard
        </h1>

        <p class="dashboard-subtitle">
          Monitor connected devices, review room-level activity,
          and analyse energy consumption across the entire home in real time.
        </p>
      </div>

      <div class="summary-grid">
        <mat-card
          class="summary-card"
          *ngFor="let item of summary; trackBy: trackByTitle"
          @fadeUp
        >
          <div class="card-header">
            <div class="card-icon-wrap">
              <span class="material-symbols-outlined card-icon">{{ item.icon }}</span>
            </div>

            <div class="card-text">
              <div class="card-title">{{ item.title }}</div>
              <div class="card-value">{{ item.value }}</div>

              <div
                class="card-subtitle"
                [ngClass]="item.type"
                *ngIf="item.subtitle"
              >
                {{ item.subtitle }}
              </div>
            </div>
          </div>
        </mat-card>
      </div>
    </div>
  </section>
