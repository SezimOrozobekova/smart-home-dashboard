<div class="editor-layout">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="toolbar">
        <button class="tool-btn" (click)="setMode('translate')">Move</button>
        <button class="tool-btn" (click)="setMode('rotate')">Rotate</button>
        <button class="tool-btn" (click)="setMode('scale')">Scale</button>
        <button class="tool-btn danger" (click)="removeSelected()">Delete</button>
      </div>

      <div class="room-settings">
        <div class="room-settings-title">Room size</div>

        <div class="room-inputs">
          <label class="room-field">
            <span>Width</span>
            <input type="number" min="4" max="30" [(ngModel)]="roomWidth" />
          </label>

          <label class="room-field">
            <span>Depth</span>
            <input type="number" min="4" max="30" [(ngModel)]="roomDepth" />
          </label>
        </div>

        <button class="tool-btn apply-btn" (click)="applyRoomSize()">
          Apply
        </button>
      </div>
    </div>

    <div class="models-section">
      <div class="models-header">Device types</div>

      <div *ngIf="isLoading" class="status-text">Loading models...</div>
      <div *ngIf="errorMessage" class="status-text error">{{ errorMessage }}</div>

      <div class="model-list" *ngIf="!isLoading && !errorMessage">
        <button
          class="model-btn"
          *ngFor="let model of models"
          (click)="addModel(model)"
        >
          {{ model.name }}
        </button>
      </div>
    </div>
  </aside>

  <main class="scene-area">
    <div #sceneHost class="scene-host"></div>
  </main>
</div>
